<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Compare CVs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }
        .container {
            width: 400px;
            margin: 100px auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input[type="file"] {
            width: 100%;
            margin: 8px 0 15px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4f46e5;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #4338ca;
        }
        .note {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ATS CV Checker</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Your CV (required)</label>
        <input type="file" name="user_cv" required>

        <label>Job Description (optional)</label>
        <textarea name="ideal_text" rows="10" cols="45" placeholder="Paste ideal resume text here..."></textarea>

        <div class="note">If provided, your Job requirement will be matched with this. Otherwise keywords will be used.</div>

        <button type="submit">Get ATS Score</button>
    </form>
</div>

</body>
</html>
